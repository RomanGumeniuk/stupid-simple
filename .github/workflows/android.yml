# Builds the Android APK and attaches it to the GitHub Release.
# Runs on Ubuntu (Linux supports the symlinks Tauri uses, unlike Windows).
#
# Optional secrets for a *signed* APK (otherwise an unsigned APK is built):
#   ANDROID_KEYSTORE_BASE64   – base64 of the .keystore file
#   ANDROID_KEYSTORE_PASSWORD – keystore password
#   ANDROID_KEY_ALIAS         – key alias (default: stupidsimple)
#   ANDROID_KEY_PASSWORD      – key password (default: keystore password)
# Plus the shared Google OAuth client (same as the desktop build):
#   VITE_GOOGLE_CLIENT_ID / VITE_GOOGLE_CLIENT_SECRET
name: Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Decode keystore (if provided)
        id: keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.signed == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npx tauri android build --apk

      - name: Collect APKs
        run: |
          mkdir -p out
          find src-tauri/gen/android -path '*/outputs/apk/*' -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - name: Upload to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          tag_name: ${{ github.ref_name }}

      - name: Upload as artifact (manual runs)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: stupid-simple-apk
          path: out/*.apk
