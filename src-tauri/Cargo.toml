[package]
name = "stupid-simple"
version = "1.8.1"
description = "Stupid Simple — a candy-colored calendar that syncs with Google Calendar"
authors = ["Roman Gumeniuk"]
edition = "2021"

[lib]
name = "stupid_simple_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
